# Portable reproduction profile for the saved local sampler comparison.
# Replace YOUR_QWEN_MODEL_ID and the loopback endpoint before use.
novel:
  title: "Example Japanese novel"
  source_dir: ./original/example-book
  output_dir: ./outputs
  books_dir: ./books
  jobs_dir: ./jobs
translation:
  source_language: ja
  target_language: ru
  chunk_chars: 800
  overlap_chars: 400
  context_strategy: previous
  temperature: 0.2
  max_tokens: 65536
  prompt_version: translate-v1
  prompts_dir: ./prompts
  glossary_path: ./resources/example-book/glossary.yaml
  retries: 2
  retry_delay_seconds: 15
validation:
  min_output_chars: 10
  min_length_ratio: 0.3
  max_length_ratio: 4.0
  max_japanese_ratio: 0.05
  repetition_count: 3
runners:
  qwen-r:
    type: opencode
    model: local/YOUR_QWEN_MODEL_ID
    base_url: http://127.0.0.1:8080/v1
    opencode_transport: cli
    timeout_seconds: 1800
    max_tokens: 65536
    reasoning_effort: xhigh
    extra_params:
      chat_template_kwargs: {enable_thinking: true}
      top_p: 0.95
      top_k: 20
      min_p: 0.05
      presence_penalty: 0.0
      frequency_penalty: 0.0
      repeat_penalty: 1.0
      seed: 9101
pipelines:
  draft-light:
    stages:
      - name: translation
        role: translator
        prompt_version: translate-draft-v1
