name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: pytest, ruff and package build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # A full-suite run needs the dev and web extras; the lock is the only
          # dependency input, so it must invalidate the uv cache when it changes.
          cache-dependency-glob: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check src tests

      - name: Build sdist
        run: uv build --sdist --out-dir dist
